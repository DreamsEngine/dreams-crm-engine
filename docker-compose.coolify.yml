# Coolify deployment: app + api + postgres.
# The agent (apps/agent) is a separate phase — it needs an AI Gateway key and a
# sandbox runtime, and the demo works without it.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: crm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://crm:${POSTGRES_PASSWORD}@postgres:5432/crm?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ALLOWED_SIGN_IN: ${ALLOWED_SIGN_IN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      API_URL: ${API_URL}
      APP_URL: ${APP_URL}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN}
      CRON_SECRET: ${CRON_SECRET}
      CRM_TELEMETRY_DISABLED: "1"
      PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        API_URL: ${API_URL}
        APP_URL: ${APP_URL}
    environment:
      API_URL: ${API_URL}
      APP_URL: ${APP_URL}
      DATABASE_URL: postgresql://crm:${POSTGRES_PASSWORD}@postgres:5432/crm?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      CRM_TELEMETRY_DISABLED: "1"
    depends_on:
      - api

volumes:
  pgdata:
